<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日热点雷达 · NewsRadar</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--border:#e3e8ef;--text:#1f2937;--text2:#6b7280;--text3:#9ca3af;
--primary:#2563eb;--primary-soft:#eff6ff;--orange:#ea580c;--orange-soft:#fff7ed;--red:#dc2626;--red-soft:#fef2f2;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:20px 20px 60px}
header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px}
h1{font-size:20px;font-weight:600}
.sub{font-size:12px;color:var(--text2)}
.sub b{color:var(--primary);font-weight:600}
.actions{margin-left:auto;display:flex;gap:8px}
button{border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-family:inherit;cursor:pointer;background:var(--primary);color:#fff;transition:.15s}
button:hover{opacity:.88}
button.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tab{padding:5px 12px;border-radius:20px;font-size:13px;background:#fff;border:1px solid var(--border);cursor:pointer;color:var(--text2)}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tab .n{font-size:11px;opacity:.65;margin-left:4px}
input[type=search]{flex:1;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--text)}
input[type=search]:focus{border-color:var(--primary)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap}
.toggle input{accent-color:var(--primary);width:15px;height:15px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:6px 18px 12px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:600;padding:12px 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .cnt{font-size:11px;font-weight:400;color:var(--text3);background:var(--bg);border-radius:10px;padding:1px 8px}
.card h2 .stale{font-size:11px;font-weight:400;color:var(--orange);background:var(--orange-soft);border-radius:10px;padding:1px 8px}
.row{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #eef2f7}
.row:last-child{border-bottom:none}
.idx{flex-shrink:0;width:20px;text-align:right;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;padding-top:2px}
.idx.top3{color:var(--red);font-weight:600}
.body{flex:1;min-width:0}
.t{font-size:14px;color:var(--text);text-decoration:none;display:block}
a.t:hover{color:var(--primary);text-decoration:underline}
.meta{font-size:11.5px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;align-items:center}
.tag{background:var(--bg);color:var(--text2);border-radius:4px;padding:0 5px;font-size:11px}
.hot{color:var(--orange)}
.kw{background:#fff7ed;color:#9a3412;border-radius:3px;padding:0 2px}
mark{background:#fef08a;color:inherit;border-radius:2px;padding:0 1px}
.empty{text-align:center;color:var(--text3);padding:40px 0;font-size:13px}
footer{font-size:11.5px;color:var(--text3);margin-top:22px;line-height:1.9}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#16a34a;margin-right:4px}
.dot.bad{background:#f59e0b}
#tip{background:var(--red-soft);color:#991b1b;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
@media(max-width:640px){.actions{margin-left:0;width:100%}h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>每日热点雷达</h1>
      <div class="sub" id="sub">读取中…</div>
    </div>
    <div class="actions">
      <button class="ghost" onclick="exportMd()">导出 Markdown</button>
      <button onclick="load(true)">重新加载</button>
    </div>
  </header>

  <div id="tip"></div>

  <div class="toolbar">
    <div id="tabs" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <input type="search" id="q" placeholder="搜索标题 / 来源…" oninput="render()">
    <label class="toggle"><input type="checkbox" id="onlyKw" onchange="render()">只看关注词</label>
  </div>

  <div id="list"></div>

  <footer id="foot"></footer>
</div>

<script>
let DATA = null;
let activeTab = 'all';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtHot(n) {
  if (!n) return '';
  if (n >= 1e8) return (n / 1e8).toFixed(1) + '亿';
  if (n >= 1e4) return Math.round(n / 1e4) + '万';
  return String(n);
}

function ago(iso) {
  const t = Date.parse(iso);
  if (!t) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}

function hi(text, words) {
  let out = esc(text);
  (words || []).forEach((w) => {
    if (!w) return;
    const e = esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(e, 'gi'), (m) => `<span class="kw">${m}</span>`);
  });
  const q = document.getElementById('q').value.trim();
  if (q) {
    const e = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(e, 'gi'), (m) => `<mark>${m}</mark>`);
  }
  return out;
}

function match(item) {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const onlyKw = document.getElementById('onlyKw').checked;
  if (onlyKw && !(item.kw && item.kw.length)) return false;
  if (!q) return true;
  return (item.title + ' ' + (item.source || '') + ' ' + (item.desc || '')).toLowerCase().includes(q);
}

function render() {
  if (!DATA) return;
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = [{ id: 'all', name: '全部', n: DATA.total }]
    .concat(DATA.sections.map((s) => ({ id: s.id, name: s.name, n: s.items.length })))
    .map((t) => `<div class="tab ${activeTab === t.id ? 'on' : ''}" onclick="setTab('${t.id}')">${esc(t.name)}<span class="n">${t.n}</span></div>`)
    .join('');

  const secs = DATA.sections.filter((s) => activeTab === 'all' || s.id === activeTab);
  let html = '';
  let shown = 0;
  for (const s of secs) {
    const items = s.items.filter(match);
    if (!items.length) continue;
    shown += items.length;
    html += `<div class="card"><h2>${esc(s.name)}<span class="cnt">${items.length}</span>${s.stale ? `<span class="stale">上次缓存 · ${ago(s.updatedAt)}</span>` : ''}</h2>`;
    html += items.map((it, i) => {
      const title = it.url
        ? `<a class="t" href="${esc(it.url)}" target="_blank" rel="noopener">${hi(it.title, it.kw)}</a>`
        : `<span class="t">${hi(it.title, it.kw)}</span>`;
      const bits = [];
      if (it.platform || it.source) bits.push(`<span class="tag">${esc(it.platform || it.source)}</span>`);
      if (it.hot) bits.push(`<span class="hot">${fmtHot(it.hot)}</span>`);
      if (it.time) bits.push(ago(it.time));
      if (it.desc) bits.push(`<span title="${esc(it.desc)}">${esc(it.desc.slice(0, 42))}${it.desc.length > 42 ? '…' : ''}</span>`);
      return `<div class="row"><div class="idx ${i < 3 && !it.platform ? 'top3' : ''}">${it.rank || i + 1}</div><div class="body">${title}<div class="meta">${bits.join('')}</div></div></div>`;
    }).join('');
    html += '</div>';
  }
  document.getElementById('list').innerHTML = html || '<div class="empty">没有匹配的内容，试试清空搜索或关闭「只看关注词」。</div>';

  document.getElementById('sub').innerHTML = `数据日期 <b>${esc(DATA.date)}</b> · 共 <b>${DATA.total}</b> 条 · 生成于 ${ago(DATA.generatedAt)}${shown !== DATA.total ? ` · 当前显示 ${shown} 条` : ''}`;

  const bad = (DATA.sources || []).filter((s) => !s.ok);
  document.getElementById('foot').innerHTML =
    `数据源：${(DATA.sources || []).map((s) => `<span class="dot ${s.ok ? '' : 'bad'}"></span>${esc(s.id)} ${s.count}`).join('　')}` +
    (bad.length ? `<br>本次有 ${bad.length} 个源失败（多半是限流），失败的板块会自动沿用上一次缓存。` : '') +
    `<br>该页面只读取本地 data/news.json，不发起任何第三方请求。`;
}

function setTab(id) { activeTab = id; render(); }

function exportMd() {
  if (!DATA) return;
  let md = `# 每日热点 · ${DATA.date}\n\n> 生成时间：${new Date(DATA.generatedAt).toLocaleString('zh-CN')}\n`;
  for (const s of DATA.sections) {
    md += `\n## ${s.name}\n\n`;
    s.items.filter(match).forEach((it, i) => {
      md += `${i + 1}. ${it.title}${it.url ? ` — [链接](${it.url})` : ''}\n`;
    });
  }
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `热点-${DATA.date}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function load(manual) {
  const tip = document.getElementById('tip');
  try {
    const res = await fetch('./data/news.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    tip.style.display = 'none';
    render();
  } catch (err) {
    tip.style.display = 'block';
    tip.innerHTML = `读取 data/news.json 失败（${esc(err.message)}）。<br>如果你是双击打开的本地文件，浏览器会拦截本地读取——请在本目录执行 <b>npm run serve</b> 后访问 http://localhost:4173 。`;
    document.getElementById('sub').textContent = '暂无数据';
  }
  if (manual) location.hash = '';
}

load();
</script>
</body>
</html>
